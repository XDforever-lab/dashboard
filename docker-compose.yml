version: "3.8"

services:
  mall-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "38173:38173"
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: analytics_dashboard/Dockerfile
    ports:
      - "9002:9002"
    volumes:
      - ./server/data:/data
    environment:
      - ESHOP_DB_PATH=/data/eshop.sqlite
    depends_on:
      - mall-api
    restart: unless-stopped
